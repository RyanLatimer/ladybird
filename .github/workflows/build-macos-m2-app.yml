name: Build macOS M2 .app

# Builds Ladybird.app for Apple Silicon (M1/M2/M3/M4) on GitHub-hosted
# macOS runners, then uploads Ladybird.app as a .zip + .dmg artifact.
# Run it from your fork: Actions tab -> "Build macOS M2 .app" -> Run workflow.
# No secrets required. Public forks get free macos-15 (arm64) minutes.

on:
  workflow_dispatch:
  push:
    branches: [macos-app]
    paths:
      - '.github/workflows/build-macos-m2-app.yml'

jobs:
  build-macos-app:
    name: macOS arm64 Ladybird.app
    runs-on: macos-15
    timeout-minutes: 360

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      LADYBIRD_SOURCE_DIR: ${{ github.workspace }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore ccache + vcpkg caches
        uses: actions/cache/restore@v4
        with:
          path: |
            .ccache
            Build/caches/vcpkg-binary-cache
            caches/WasmSpecTests
          key: ladybird-macos-arm64-Release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'Meta/CMake/wasm_spec_tests.cmake') }}
          restore-keys: |
            ladybird-macos-arm64-Release-

      - name: Select Xcode (whatever the runner has)
        shell: bash
        run: |
          ls /Applications | grep -i xcode || true
          xcodebuild -version || true
          # Use the default Xcode on the runner (Xcode 16.x on macos-15 is fine;
          # upstream docs only require Xcode 15+). Don't pin 26.6 — that only
          # exists on Ladybird's self-hosted macos-26 runners.
          sudo xcode-select -p || true

      - name: Install dependencies (brew)
        shell: bash
        run: |
          brew update
          brew unlink openssl@3 || true
          brew install autoconf autoconf-archive automake bash ccache \
            coreutils libtool llvm@22 nasm ninja pkg-config unzip
          echo "$(brew --prefix llvm@22)/bin" >> "$GITHUB_PATH"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python deps
        shell: bash
        run: |
          python3 -m pip install --upgrade pip
          pip3 install pyyaml requests six cryptography

      - name: Configure (Release)
        shell: bash
        run: |
          echo "CC=$(xcrun --find clang)" >> "$GITHUB_ENV"
          echo "CXX=$(xcrun --find clang++)" >> "$GITHUB_ENV"
          CC="$(xcrun --find clang)" CXX="$(xcrun --find clang++)" \
            cmake --preset Release

      - name: Build
        shell: bash
        run: |
          echo "CCACHE_COMPILERCHECK=%compiler% -v" >> "$GITHUB_ENV"
          cmake --build --preset Release

      - name: Save ccache + vcpkg caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            .ccache
            Build/caches/vcpkg-binary-cache
            caches/WasmSpecTests
          key: ladybird-macos-arm64-Release-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'Meta/CMake/wasm_spec_tests.cmake') }}-${{ github.run_id }}

      - name: Verify app bundle
        shell: bash
        run: |
          ls -la Build/release/bin/ | head -30
          test -d Build/release/bin/Ladybird.app || (echo "::error::Ladybird.app not found"; exit 1)
          # Ad-hoc re-sign so it launches on your Mac without a paid cert
          codesign -s - -v -f --deep Build/release/bin/Ladybird.app || true
          codesign -dv Build/release/bin/Ladybird.app || true

      - name: Package (.zip + .dmg)
        shell: bash
        run: |
          cd Build/release/bin
          ditto -c -k --sequesterRsrc --keepParent Ladybird.app Ladybird-macOS-arm64.zip
          hdiutil create -volname Ladybird -srcfolder Ladybird.app -ov -format UDZO Ladybird-macOS-arm64.dmg
          ls -lh Ladybird-macOS-arm64.*

      - name: Upload Ladybird.app (zip)
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-macOS-arm64-zip
          path: Build/release/bin/Ladybird-macOS-arm64.zip
          compression-level: 0
          if-no-files-found: error

      - name: Upload Ladybird.app (dmg)
        uses: actions/upload-artifact@v4
        with:
          name: Ladybird-macOS-arm64-dmg
          path: Build/release/bin/Ladybird-macOS-arm64.dmg
          compression-level: 0
          if-no-files-found: error
